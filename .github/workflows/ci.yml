name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: pytest (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Bağımlılıklar
        run: pip install -e ".[dev]"
      - name: Testler
        run: pytest -q -p no:warnings

  report:
    # README §9.4: gerçekçilik raporu ve süre ölçümleri raporlanır, test eşiği olarak kullanılmaz.
    name: Gerçekçilik ve performans raporu
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Bağımlılıklar
        run: pip install -e ".[dev]"
      - name: Gerçekçilik raporu (gerçek veri, 300 mock)
        run: python scripts/run_mock_batch.py --n 300 --seed 1 --data data/real/ --out reports/
      - name: Gerçekçilik raporu (sentetik veri, 300 mock)
        run: python scripts/run_mock_batch.py --n 300 --seed 1 --data data/synthetic/ --out reports/synthetic/
      - name: Performans ölçümü (gerçek veri)
        run: python scripts/profile_advisor.py --batch --data data/real/ --out reports/
      - name: Job özeti
        if: always()
        run: |
          cat reports/profile_advisor.md >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          sed -n '1,40p' reports/realism_n300_seed1.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reports
          path: reports/
